annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate probability of missed connection based on inbound flight delay
  and airport minimum connect time (MCT).
input_schema:
  additionalProperties: false
  properties:
    airport_code:
      type: string
    inbound_delay_mins:
      type: number
    scheduled_layover_mins:
      type: number
  required:
  - inbound_delay_mins
  - airport_code
  - scheduled_layover_mins
  type: object
name: evaluate-connection-risk
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object

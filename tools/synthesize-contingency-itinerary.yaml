annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Build multi-modal contingency travel itinerary combining flights, high-speed
  rail, and local hotels.
input_schema:
  additionalProperties: false
  properties:
    arrival_deadline:
      type: string
    current_location:
      type: string
    final_destination:
      type: string
  required:
  - current_location
  - final_destination
  type: object
name: synthesize-contingency-itinerary
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
